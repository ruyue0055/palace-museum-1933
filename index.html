<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>档案里的木箱山河 · 故宫南迁万里录（1933—1949）</title>
<meta name="description" content="第一人称历史亲历 · 多分支互动文游。《档案里的木箱山河：故宫南迁万里录》以一名年轻典守员的视角，走过故宫文物南迁的万里长路，五重结局，由你选择。">
<meta name="theme-color" content="#05070a">
<meta property="og:title" content="档案里的木箱山河 · 故宫南迁万里录">
<meta property="og:description" content="五幕、五重结局的互动叙事。你来典守。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23090b0e'/%3E%3Crect x='9' y='9' width='46' height='46' fill='none' stroke='%23b24a34' stroke-width='3'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%23d9b877' font-family='serif'%3E守%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- 背景层：程序化天候底片，或你的插画 -->
<div class="bg" id="bg"></div>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<!-- 顶栏 -->
<header class="hud">
  <div class="hud-left">
    <div class="hud-brand">
      <span class="hud-seal">守</span>
      <b>档案里的木箱山河</b>
    </div>
    <div class="hud-scene">
      <span id="hudAct">第一幕</span><em>·</em><span id="hudTime"></span><em>·</em><span id="hudPlace"></span>
    </div>
  </div>
  <nav class="hud-actions" aria-label="功能">
    <button data-act="diary">日志 (<span id="diaryCount">0</span>)</button>
    <button data-act="history">回想</button>
    <button data-act="save">卷宗</button>
    <button data-act="endings">结局</button>
    <button data-act="about">史料</button>
  </nav>
</header>

<!-- 左侧：文物 -->
<button class="rail rail-l" id="btnRelics" aria-label="文物陈列">
  <span class="rail-ico">◫</span>
  <span class="rail-txt">文物</span>
  <em class="rail-num" id="relicCount">0/13</em>
</button>

<!-- 右下：行程图 -->
<div class="minimap" id="btnMap" role="button" tabindex="0" aria-label="南迁路线图">
  <div class="mm-canvas" id="mapMini"></div>
  <div class="mm-bar"><span>行程</span><em id="mapStageLabel">北平</em></div>
</div>

<!-- 字幕舞台 -->
<main class="stage" id="stage">
  <div class="stage-col">

    <div class="choices" id="choices" hidden></div>

    <div class="subtitle" id="subtitle">
      <div class="sub-file" id="fileNo">檔案 · 第 001 號</div>
      <div class="sub-lines" id="textBody" tabindex="0" aria-live="polite"></div>
      <div class="sub-foot">
        <div class="sub-ctrl">
          <button id="btnAuto">自动</button>
          <button id="btnSkip">快进</button>
          <button id="btnReplay">回到抉择</button>
        </div>
        <div class="sub-hint" id="tapHint"><i></i>点击继续</div>
      </div>
    </div>

  </div>
</main>

<!-- 文物抽拉栏 -->
<div class="drawer drawer-l" id="relicDrawer" aria-hidden="true">
  <div class="dr-head">
    <h2>陈列 · 文物</h2>
    <button class="dr-close" id="drawerClose">✕</button>
  </div>
  <div class="dr-body relic-grid" id="relicGrid"></div>
  <div class="dr-foot">随剧情解锁 · 点击全屏鉴赏</div>
</div>

<!-- 全屏浮层：文物鉴赏 / 全图 -->
<div class="overlay" id="overlay" hidden>
  <div class="overlay-bar">
    <div class="ob-title" id="ovTitle"></div>
    <div class="ob-actions">
      <button class="ob-btn" id="ovPrev" aria-label="上一件">‹</button>
      <button class="ob-btn" id="ovNext" aria-label="下一件">›</button>
      <button class="ob-btn ob-close" id="ovClose" aria-label="关闭">关闭 ✕</button>
    </div>
  </div>
  <div class="overlay-body" id="overlayBody"></div>
</div>

<!-- 弹窗 -->
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="modal-x" id="modalClose" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- 幕次卡 / 日志手札挂载点 -->
<div class="actcard-host" id="actcardHost"></div>

<!-- 开场 -->
<div class="curtain" id="curtain">
  <div class="curtain-bg" aria-hidden="true"></div>
  <div class="curtain-inner">
    <div class="ct-kicker">第一人称历史亲历 · 大人物视角切换</div>
    <h1 class="ct-title"><span>档</span><span>案</span><span>里</span><span>的</span><span>木</span><span>箱</span><span>山</span><span>河</span></h1>
    <p class="ct-sub">故宫南迁万里录</p>
    <div class="ct-rule"><i></i><em>壹玖叁叁 — 壹玖肆玖</em><i></i></div>
    <p class="ct-desc">二千一百一十八只木箱，一万三千余件国宝。<br>三万里山河，十六年烽火。<br>你只是其中一名年轻的典守员。</p>
    <div class="ct-actions">
      <button class="btn-primary" id="btnStart">开始典守</button>
      <button class="btn-ghost" id="btnContinue" hidden>续上旧档</button>
    </div>
    <div class="ct-foot"><span>五幕 · 五重结局 · 专属手札日志</span><span>建议全屏观看</span></div>
  </div>
  <div class="ct-corner tl"></div><div class="ct-corner tr"></div>
  <div class="ct-corner bl"></div><div class="ct-corner br"></div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/map.js"></script>
<script src="assets/js/bg.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
