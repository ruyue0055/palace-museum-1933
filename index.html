<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>档案里的故宫南迁：万里典守录（1933—1949）</title>
<style>
  :root {
    --bg-dark: #14100e;
    --bg-panel: #1f1916;
    --paper: #f3ead8;
    --paper-dark: #e5d7be;
    --palace-red: #8c221c;
    --palace-red-light: #b3362f;
    --gold: #c59b52;
    --gold-light: #e2be7d;
    --ink: #261e19;
    --ink-muted: #5c4e43;
    --text-light: #f5ece0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 20% 20%, rgba(140, 34, 28, 0.18) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(197, 155, 82, 0.12) 0%, transparent 50%);
    color: var(--ink);
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 40px;
    line-height: 1.75;
  }

  .app-container {
    width: 100%;
    max-width: 780px;
    background: var(--paper);
    background-image: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(229,215,190,0.4) 100%);
    border: 2px solid var(--gold);
    border-radius: 8px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65), inset 0 0 32px rgba(139, 98, 52, 0.15);
    overflow: hidden;
    position: relative;
  }

  .top-header {
    background: linear-gradient(90deg, #5e1410 0%, var(--palace-red) 50%, #5e1410 100%);
    color: var(--text-light);
    padding: 16px 20px;
    border-bottom: 2px solid var(--gold);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .title-group h1 {
    font-size: 1.25rem;
    letter-spacing: 1.5px;
    color: #faeed7;
    font-weight: 700;
  }

  .title-group p {
    font-size: 0.78rem;
    color: var(--gold-light);
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .btn-top {
    background: rgba(20, 16, 14, 0.45);
    color: var(--gold-light);
    border: 1px solid var(--gold);
    padding: 5px 11px;
    font-size: 0.78rem;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }

  .btn-top:hover {
    background: var(--gold);
    color: var(--ink);
  }

  .status-bar {
    background: var(--paper-dark);
    border-bottom: 1px dashed rgba(92, 78, 67, 0.4);
    padding: 10px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    font-size: 0.84rem;
    color: var(--ink-muted);
    align-items: center;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-label {
    font-weight: 700;
    color: var(--palace-red);
  }

  .badge-pill {
    display: inline-block;
    background: rgba(140, 34, 28, 0.12);
    border: 1px solid var(--palace-red);
    color: var(--palace-red);
    font-size: 0.75rem;
    padding: 1px 8px;
    border-radius: 3px;
    margin-right: 4px;
    font-weight: 600;
  }

  .route-progress {
    background: #ebe0cb;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(197, 155, 82, 0.4);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.78rem;
    overflow-x: auto;
  }

  .step-node {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #8c7b6b;
    white-space: nowrap;
  }

  .step-node.active {
    color: var(--palace-red);
    font-weight: 700;
  }

  .step-node.done {
    color: var(--ink);
  }

  .step-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #bfb09c;
    display: inline-block;
  }

  .step-node.active .step-dot {
    background: var(--palace-red);
    box-shadow: 0 0 0 3px rgba(140, 34, 28, 0.25);
  }

  .step-node.done .step-dot {
    background: var(--gold);
  }

  .step-line {
    flex: 1;
    height: 1px;
    background: #cbbba4;
    margin: 0 8px;
    min-width: 16px;
  }

  .stage-body {
    padding: 26px 24px 30px;
  }

  .act-tag {
    display: inline-block;
    background: var(--palace-red);
    color: #fff;
    padding: 3px 12px;
    font-size: 0.8rem;
    letter-spacing: 1.5px;
    border-radius: 3px;
    margin-bottom: 10px;
  }

  .scene-title {
    font-size: 1.45rem;
    color: var(--ink);
    margin-bottom: 14px;
    border-left: 4px solid var(--palace-red);
    padding-left: 12px;
    line-height: 1.35;
  }

  .history-box {
    background: rgba(229, 215, 190, 0.65);
    border: 1px solid #cbb99e;
    border-left: 3px solid var(--gold);
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 0.92rem;
    color: #3d3128;
    margin-bottom: 18px;
  }

  .history-box strong {
    color: var(--palace-red);
  }

  .narrative-text {
    font-size: 1.02rem;
    color: var(--ink);
    margin-bottom: 18px;
    text-align: justify;
  }

  .narrative-text p {
    margin-bottom: 12px;
    text-indent: 2em;
  }

  .dialogue-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: 20px 0;
  }

  .dialogue-card {
    background: #faf5eb;
    border: 1px solid #d8c8b0;
    border-radius: 6px;
    padding: 14px 16px;
    position: relative;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
  }

  .dialogue-card.left-side {
    border-left: 4px solid var(--palace-red);
  }

  .dialogue-card.right-side {
    border-left: 4px solid #3c5a6b;
  }

  .speaker-name {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--palace-red);
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .dialogue-card.right-side .speaker-name {
    color: #2c4a5c;
  }

  .speaker-desc {
    font-size: 0.78rem;
    font-weight: normal;
    color: var(--ink-muted);
  }

  .speaker-words {
    font-size: 0.96rem;
    color: var(--ink);
  }

  .pov-banner {
    background: linear-gradient(90deg, rgba(140, 34, 28, 0.1) 0%, transparent 100%);
    border-top: 1px solid rgba(140, 34, 28, 0.3);
    border-bottom: 1px solid rgba(140, 34, 28, 0.3);
    padding: 8px 14px;
    margin-bottom: 16px;
    font-weight: 700;
    color: var(--palace-red);
    font-size: 0.92rem;
    letter-spacing: 0.5px;
  }

  .choices-section {
    margin-top: 24px;
    border-top: 1px dashed #c4b299;
    padding-top: 18px;
  }

  .choices-prompt {
    font-weight: 700;
    color: var(--palace-red);
    margin-bottom: 12px;
    font-size: 0.98rem;
  }

  .choice-btn {
    width: 100%;
    text-align: left;
    background: #fcf8f0;
    border: 1.5px solid #bfa888;
    border-radius: 6px;
    padding: 14px 18px;
    margin-bottom: 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.96rem;
    color: var(--ink);
    transition: all 0.22s ease;
    position: relative;
    display: block;
  }

  .choice-btn:hover {
    background: #fffdf9;
    border-color: var(--palace-red);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(140, 34, 28, 0.14);
  }

  .choice-btn .choice-tag {
    display: inline-block;
    font-weight: 700;
    color: var(--palace-red);
    margin-right: 6px;
  }

  .choice-btn .choice-sub {
    display: block;
    font-size: 0.82rem;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  .ending-card {
    background: linear-gradient(145deg, #fbf4e6 0%, #efe1c6 100%);
    border: 2px double var(--palace-red);
    border-radius: 8px;
    padding: 24px 20px;
    margin-top: 16px;
    position: relative;
    text-align: center;
  }

  .ending-seal {
    display: inline-block;
    border: 2px solid var(--palace-red);
    color: var(--palace-red);
    padding: 4px 14px;
    font-weight: 700;
    letter-spacing: 3px;
    font-size: 0.85rem;
    margin-bottom: 10px;
    background: rgba(140, 34, 28, 0.06);
  }

  .ending-title {
    font-size: 1.55rem;
    color: var(--palace-red);
    margin-bottom: 16px;
    letter-spacing: 2px;
  }

  .ending-body {
    text-align: justify;
    font-size: 1rem;
    color: var(--ink);
    line-height: 1.85;
    margin-bottom: 20px;
  }

  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 999;
  }

  .modal-mask.open {
    display: flex;
  }

  .modal-box {
    background: var(--paper);
    border: 2px solid var(--gold);
    border-radius: 8px;
    max-width: 640px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 22px;
    color: var(--ink);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #cbb99e;
    padding-bottom: 10px;
    margin-bottom: 16px;
  }

  .modal-header h3 {
    color: var(--palace-red);
    font-size: 1.15rem;
  }

  .ending-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .ending-item {
    border: 1px solid #cbb99e;
    background: #faf5eb;
    padding: 12px 14px;
    border-radius: 6px;
  }

  .ending-item.locked {
    opacity: 0.6;
    background: #e9decb;
  }

  .ending-item h4 {
    color: var(--palace-red);
    font-size: 0.96rem;
    margin-bottom: 4px;
  }

  .ending-item p {
    font-size: 0.83rem;
    color: var(--ink-muted);
  }

  .footer-note {
    text-align: center;
    padding: 12px;
    font-size: 0.76rem;
    color: var(--ink-muted);
    border-top: 1px solid rgba(197, 155, 82, 0.3);
    background: #ebe0cb;
  }

  @media (max-width: 600px) {
    .stage-body {
      padding: 18px 15px 24px;
    }
    .scene-title {
      font-size: 1.22rem;
    }
  }
</style>
</head>
<body>

<div class="app-container">
  <header class="top-header">
    <div class="title-group">
      <h1>档案里的故宫南迁：万里典守录</h1>
      <p>1933—1949 · 第一人称历史亲历 · 多分支互动文游</p>
    </div>
    <div class="header-actions">
      <button class="btn-top" id="btnArchive">典守结局录 (<span id="unlockCount">0</span>/5)</button>
      <button class="btn-top" id="btnRestart">重返1933</button>
    </div>
  </header>

  <div class="status-bar">
    <div class="status-item">
      <span class="status-label">纪年：</span>
      <span id="uiTime">1933年1月</span>
    </div>
    <div class="status-item">
      <span class="status-label">方位：</span>
      <span id="uiLocation">北平 · 紫禁城太和殿广场</span>
    </div>
    <div class="status-item">
      <span class="status-label">当前视角：</span>
      <span id="uiPov">青年典守员</span>
    </div>
    <div class="status-item" id="badgeContainer">
      <span class="status-label">随身卷宗：</span>
      <span id="uiBadges"><span class="badge-pill">文渊阁四库清册</span></span>
    </div>
  </div>

  <div class="route-progress" id="progressBar">
    <div class="step-node active" data-step="1"><span class="step-dot"></span>一幕·古都去留</div>
    <div class="step-line"></div>
    <div class="step-node" data-step="2"><span class="step-dot"></span>二幕·沪上清册与英伦</div>
    <div class="step-line"></div>
    <div class="step-node" data-step="3"><span class="step-dot"></span>三幕·三路西迁生死线</div>
    <div class="step-line"></div>
    <div class="step-node" data-step="4"><span class="step-dot"></span>四幕·胜利东归与终局</div>
  </div>

  <main class="stage-body" id="stageBody"></main>

  <footer class="footer-note">
    史料依据：故宫博物院官网《故宫文物南迁史料展》专题 & 《文物西迁》官方词条 · 余砚为月月制作
  </footer>
</div>

<div class="modal-mask" id="archiveModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>《万里典守录》五重历史结局图鉴</h3>
      <button class="btn-top" id="btnCloseModal" style="color:#261e19;border-color:#8c221c;">关闭卷宗</button>
    </div>
    <div class="ending-grid" id="endingGrid"></div>
  </div>
</div>

<script>
const ENDINGS_META = {
  ending1: {
    code: "结局一 · 史实主线结局",
    title: "【万里北返 · 紫禁重光】",

  },
  ending2: {
    code: "结局二 · 两岸守望结局",
    title: "【隔海守望 · 一脉双城】",
    hint: "在第四幕选择随庄尚严、那志良登船押运三批精品文物赴台。"
  },
  ending3: {
    code: "结局三 · 国际传播结局",
    title: "【播扬四海 · 文明回响】",

    code: "结局四 · 留平隐藏结局",

};

const SCENES = {
  act1_main: {

    pov: "故宫博物院年轻典守员",
    history: "<strong>【历史档案背景】</strong>1933年1月，日军攻陷山海关（榆关），华北危如累卵。紫禁城内寒风呼啸，太和殿广场与午门内堆满了连夜用绵纸、稻草和铁皮箍紧的2118只大木箱。然而宫墙之外，整个北平城却因“故宫文物到底该不该南迁”掀起了一场惊天风暴。",

    ],
    dialogues: [
      {

      {

        next: "act1_zhou_pov"
      }

  },

  act1_yi_pov: {

let gameState = {
  currentScene: "act1_main",
  badges: ["文渊阁四库清册"],
  flags: {},
  unlockedEndings: []
};

async function loadSavedState() {
  try {
    const local = localStorage.getItem("PALACE_SOUTH_MIGRATION_STATE_V1");
    if (local) {
      const parsed = JSON.parse(local);
      if (parsed && parsed.currentScene) {
        gameState = parsed;
      }
    }
  } catch (e) {
    console.warn("State load fallback:", e);
  }
}

function saveState() {
  try {
    localStorage.setItem("PALACE_SOUTH_MIGRATION_STATE_V1", JSON.stringify(gameState));
  } catch (e) {
    console.warn("State save warning:", e);
  }
}

function renderProgress(step) {
  const nodes = document.querySelectorAll("#progressBar .step-node");
  nodes.forEach(node => {
    const s = parseInt(node.getAttribute("data-step"), 10);
    node.classList.remove("active", "done");
    if (s === step) node.classList.add("active");
    else if (s < step) node.classList.add("done");
  });
}

function renderScene() {
  const scene = SCENES[gameState.currentScene] || SCENES.act1_main;

  if (scene.isEnding && scene.endingId) {
    if (!gameState.unlockedEndings.includes(scene.endingId)) {
      gameState.unlockedEndings.push(scene.endingId);
      saveState();
    }
  }

  document.getElementById("uiTime").textContent = scene.time || "";
  document.getElementById("uiLocation").textContent = scene.location || "";
  document.getElementById("uiPov").textContent = scene.pov || "";
  document.getElementById("unlockCount").textContent = gameState.unlockedEndings.length;

  const badgeHtml = gameState.badges.map(b => `<span class="badge-pill">${b}</span>`).join("");
  document.getElementById("uiBadges").innerHTML = badgeHtml;

  renderProgress(scene.step || 1);

  const stage = document.getElementById("stageBody");
  let html = `<div class="act-tag">${scene.actTag}</div>`;

  if (scene.isEnding) {
    html += `
      <div class="ending-card">
        <div class="ending-seal">${scene.seal}</div>
        <h2 class="ending-title">${scene.title}</h2>
        <div class="ending-body">
          ${scene.paragraphs.map(p => `<p style="margin-bottom:12px;text-indent:2em;">${p}</p>`).join("")}
        </div>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;">
          <button class="choice-btn" style="max-width:260px;text-align:center;margin:0;" onclick="restartGame()">
            <span class="choice-tag">再启尘封档案</span>重新踏上1933护宝之路
          </button>
          <button class="choice-btn" style="max-width:260px;text-align:center;margin:0;" onclick="openArchiveModal()">
            <span class="choice-tag">查阅结局全录</span>已点亮 ${gameState.unlockedEndings.length} / 5 个历史结局
          </button>
        </div>
      </div>
    `;
    stage.innerHTML = html;
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  html += `<h2 class="scene-title">${scene.title}</h2>`;

  if (scene.povBanner) {
    html += `<div class="pov-banner">${scene.povBanner}</div>`;
  }

  if (scene.history) {
    html += `<div class="history-box">${scene.history}</div>`;
  }

  if (scene.paragraphs && scene.paragraphs.length) {
    html += `<div class="narrative-text">${scene.paragraphs.map(p => `<p>${p}</p>`).join("")}</div>`;
  }

  if (scene.dialogues && scene.dialogues.length) {
    html += `<div class="dialogue-list">`;
    scene.dialogues.forEach(d => {
      html += `
        <div class="dialogue-card ${d.side}">
          <div class="speaker-name">
            <span>${d.speaker}</span>
            <span class="speaker-desc">${d.desc}</span>
          </div>
          <div class="speaker-words">${d.words}</div>
        </div>
      `;
    });
    html += `</div>`;
  }

  if (scene.choices && scene.choices.length) {
    html += `<div class="choices-section">`;
    if (scene.prompt) {
      html += `<div class="choices-prompt">${scene.prompt}</div>`;
    }
    scene.choices.forEach((c, idx) => {
      if (c.onlyIfFlag && !gameState.flags[c.onlyIfFlag]) {
        return;
      }
      let extraTag = "";
      if (c.requireFlag && gameState.flags[c.requireFlag]) {
        extraTag = ` <span class="badge-pill">已达成伦敦艺展前置</span>`;
      }
      html += `
        <button class="choice-btn" onclick="chooseOption(${idx})">
          <span class="choice-tag">${c.tag}</span>${c.text}${extraTag}
          <span class="choice-sub">${c.sub || ""}</span>
        </button>
      `;
    });
    html += `</div>`;
  }

  stage.innerHTML = html;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

window.chooseOption = function(idx) {
  const scene = SCENES[gameState.currentScene];
  if (!scene || !scene.choices || !scene.choices[idx]) return;
  const choice = scene.choices[idx];

  if (choice.addBadge && !gameState.badges.includes(choice.addBadge)) {
    gameState.badges.push(choice.addBadge);
  }
  if (choice.setFlag) {
    gameState.flags[choice.setFlag] = true;
  }
  gameState.currentScene = choice.next;
  saveState();
  renderScene();
};

window.restartGame = function() {
  gameState.currentScene = "act1_main";
  gameState.badges = ["文渊阁四库清册"];
  gameState.flags = {};
  saveState();
  renderScene();
};

window.openArchiveModal = function() {
  const grid = document.getElementById("endingGrid");
  grid.innerHTML = Object.keys(ENDINGS_META).map(key => {
    const item = ENDINGS_META[key];
    const unlocked = gameState.unlockedEndings.includes(key);
    return `
      <div class="ending-item ${unlocked ? "" : "locked"}">
        <h4>${item.code} · ${item.title} ${unlocked ? "【已典藏】" : "【待解锁】"}</h4>
        <p>${item.hint}</p>
      </div>
    `;
  }).join("");
  document.getElementById("archiveModal").classList.add("open");
};

document.getElementById("btnArchive").addEventListener("click", window.openArchiveModal);
document.getElementById("btnRestart").addEventListener("click", window.restartGame);
document.getElementById("btnCloseModal").addEventListener("click", () => {
  document.getElementById("archiveModal").classList.remove("open");
});

loadSavedState().then(() => {
  renderScene();
});
</script>
